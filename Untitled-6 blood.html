<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>BloodLink: Smart Blood Bank Platform (Demo)</title><meta name="description" content="BloodLink hackathon prototype with simulated data.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F4F7FA;--sf:#FFFFFF;--tx:#172B3A;--mu:#5D6B7A;--bd:#DCE4EC;--br:#16324F;--rd:#C62838;--gn:#21865B;--am:#A96800;--er:#B42332;--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a28;--sf:#15263a;--tx:#e8eef5;--mu:#a3b2c2;--bd:#2c4059;--br:#7fb0e6;--rd:#ff6b78;--gn:#4cc38a;--am:#e8b04b;--er:#ff6b78;--on:#0e1a28}}
:root[data-theme=dark]{--bg:#0e1a28;--sf:#15263a;--tx:#e8eef5;--mu:#a3b2c2;--bd:#2c4059;--br:#7fb0e6;--rd:#ff6b78;--gn:#4cc38a;--am:#e8b04b;--er:#ff6b78;--on:#0e1a28}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;margin:.2em 0}h1{font-size:2rem}h2{font-size:1.4rem}
.demo{background:#C62838;color:#fff;text-align:center;font-size:12px;padding:3px}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
.logo{font:700 1.2rem Inter,system-ui,sans-serif;color:var(--rd);margin-right:auto}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}nav a{padding:6px 10px;border-radius:6px;color:var(--tx);text-decoration:none;white-space:nowrap;font-size:14px}nav a.on{background:var(--br);color:var(--sf)}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
input,select,textarea,button{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx)}
button{min-height:44px;cursor:pointer;background:var(--br);color:var(--sf);border:0}button.s{background:none;color:var(--tx);border:1px solid var(--bd)}button.r{background:var(--rd);color:var(--on)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rd);outline-offset:2px}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}.ok{color:var(--gn)}.wn{color:var(--am)}.er{color:var(--er)}.mu{color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:12px}.tl div{margin:6px 0}
.stat{font:700 1.8rem Inter,system-ui,sans-serif}.bar{height:14px;background:var(--rd);border-radius:3px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:6px;display:none;z-index:9}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--mu)}}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Inter,system-ui,sans-serif}.demo{font-weight:600;letter-spacing:.02em;padding:5px}
.hero{background:linear-gradient(135deg,#14213d,#1d3a6e);color:#fff;border-radius:14px;padding:28px 20px;margin:6px 0 14px}.hero p{color:#d5def2;max-width:60ch}.hero h1{font-size:clamp(1.6rem,5vw,2.4rem)}
.card{border-radius:12px;box-shadow:0 1px 3px rgba(20,33,61,.08)}.stat{color:var(--rd)}button{border-radius:8px;min-height:38px}
#ax{position:relative}#ax summary{cursor:pointer;padding:7px 10px;border:1px solid var(--bd);border-radius:8px}#ax div{position:absolute;right:0;top:110%;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;z-index:9;min-width:190px}#ax label{flex-direction:row;gap:6px;color:var(--tx);padding:4px 0}
html.lg body{font-size:19px}html.hc{--bd:#6b7280}html.hc:not([data-theme=dark]){--mu:#2b3550}html.hc *:focus-visible{outline:3px solid #ffb703!important}html.rm *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
@media print{header,nav,.demo,button,#toast{display:none!important}}
</style></head><body>
<div class="demo">DEMO MODE — SIMULATED DATA. Not a real blood bank or medical service.</div>
<header><span class="logo"><svg width="22" height="26" viewBox="0 0 22 26" aria-hidden="true" style="vertical-align:-4px"><path d="M11 1C11 1 2 11 2 17a9 9 0 0018 0C20 11 11 1 11 1z" fill="currentColor"/></svg> BloodLink</span>
<label>Demo role<select id="role"><option>Visitor<option>Donor<option>Hospital staff<option>Blood bank admin<option>Super admin</select></label>
<label>Language<select id="lang"><option value="en">English<option value="hi">हिन्दी<option value="mr">मराठी</select></label><button class="s" id="th" aria-label="Toggle light or dark theme">Theme</button><details id="ax"><summary>Accessibility</summary><div><label><input type="checkbox" data-ax="lg"> Larger text</label><label><input type="checkbox" data-ax="hc"> Higher contrast</label><label><input type="checkbox" data-ax="rm"> Reduce motion</label></div></details></header>
<nav id="nav" style="padding:6px 14px"></nav>
<main id="app"></main><div id="toast" role="status"></div>
<script>
const G=['A+','A-','B+','B-','AB+','AB-','O+','O-'],C=['Whole blood','Red cells','Platelets','Plasma'];
const F=[{id:'F1',n:'Sassoon Demo Blood Centre',c:'Pune',d:'Pune',t:'Urban'},{id:'F2',n:'Ahilyanagar Demo Blood Bank',c:'Ahilyanagar',d:'Ahilyanagar',t:'Town'},{id:'F3',n:'Shevgaon Demo Rural Centre',c:'Shevgaon',d:'Ahilyanagar',t:'Rural'},{id:'F4',n:'Nashik Demo Blood Bank',c:'Nashik',d:'Nashik',t:'Urban'}];
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),now=()=>new Date().toLocaleString();
function seed(){let u=[],k=1;F.forEach((f,fi)=>G.forEach((g,gi)=>{if((gi+fi)%3==2)return;C.forEach((c,ci)=>{if((gi+ci+fi)%2)return;const st=(gi*7+ci+fi)%11==0?'testing':(gi+ci)%13==0?'expired':'available';u.push({id:'BU-'+String(1000+k++),fac:f.id,grp:g,comp:c,qty:1,exp:st=='expired'?day(-2):day(2+(gi*5+ci*3+fi*4)%38),st,log:[['Collected',now()]]})})}));
return{units:u,reqs:[{id:'REQ-2001',name:'Demo Family A',ph:'1234',grp:'O-',comp:'Red cells',qty:1,fac:'F1',st:'Awaiting verification',units:[],log:[['Submitted',now()]]}],
camps:[{id:'C1',n:'Community Camp, Shevgaon',fac:'F3',date:day(6),cap:4,booked:1},{id:'C2',n:'College Camp, Pune',fac:'F1',date:day(10),cap:3,booked:3}],
appts:[],comps:[{id:'CMP-3001',cat:'Overcharging',txt:'Sample bill shows duplicate storage charge.',st:'Under review',note:''}],
notifs:[{t:'Low stock: check O- and AB- platelets',r:0}],audit:[['System','Demo data loaded',now()]]}}
let S;try{S=JSON.parse(localStorage.getItem('bl'))}catch(e){}if(!S)S=seed();
{const base=seed();if(!S||!Array.isArray(S.units))S=base;['reqs','camps','appts','comps','notifs','audit','donors'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=base[k]||[]});S.units.forEach(u=>{u.log=u.log||[];u.upd=u.upd||(u.log.slice(-1)[0]||[])[1]||now()})}
const dl=async(name,text)=>{try{const d=window.claude&&await claude.use('downloads');const b=new Blob([text]);if(d)await d.save({filename:name,data:b});else{const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=name;l.click()}}catch(e){if(!e||e.code!='declined')toast('Download failed')}};
const save=()=>{try{localStorage.setItem('bl',JSON.stringify(S))}catch(e){}};
const log=(a,m)=>{S.audit.unshift([a,m,now()]);save()};
const note=t=>{S.notifs.unshift({t,r:0});save()};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const $=s=>document.querySelector(s),fn=id=>F.find(f=>f.id==id)?.n||id,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=s=>({available:'ok',reserved:'wn',testing:'wn',expired:'er',discarded:'er',issued:'mu'}[s]||'mu');
const role=()=>$('#role').value,isA=()=>['Blood bank admin','Super admin'].includes(role());
const pages={home:'Home',find:'Find Blood',dir:'Directory',request:'Request Blood',donor:'Donors',track:'Track',camps:'Camps',charges:'Charges & Concerns',help:'Help & Privacy',inv:'Inventory*',reqs:'Requests*',insights:'Insights*',audit:'Audit*',notif:'Notifications'};
const TR={hi:{'Home':'होम','Find Blood':'रक्त खोजें','Request Blood':'रक्त का अनुरोध','Donors':'रक्तदाता','Track':'ट्रैक करें','Camps':'शिविर','Notifications':'सूचनाएँ','Help & Privacy':'सहायता और गोपनीयता','Directory':'निर्देशिका','Book a donation':'रक्तदान बुक करें'},mr:{'Home':'मुख्यपृष्ठ','Find Blood':'रक्त शोधा','Request Blood':'रक्ताची विनंती','Donors':'रक्तदाते','Track':'मागोवा','Camps':'शिबिरे','Notifications':'सूचना','Help & Privacy':'मदत आणि गोपनीयता','Directory':'निर्देशिका','Book a donation':'रक्तदान नोंदवा'}};
let lang='en';try{lang=localStorage.getItem('bll')||'en'}catch(e){}const T=x=>(TR[lang]||{})[x]||x;
let page='home',q={};
const opt=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
const free=u=>u.st=='available'&&u.exp>=day(0);
function view(){const p=page,a=S;
if(p.includes('*')==0&&['inv','reqs','insights','audit'].includes(p)&&!isA())return`<div class="card"><h2>Admin access needed</h2><p>Switch the demo role to Blood bank admin or Super admin. This role switch is a demo only; real authorization must happen on a server.</p></div>`;
if(p=='home'){const av=a.units.filter(free).length;return`<div class="hero"><h1>The Right Blood. The Right Connection. Faster.</h1><p>A prototype for blood stock visibility, emergency requests, unit traceability and transparent charges.</p>
<div class="row"><button class="r" data-go="find">${T('Find Blood')}</button><button data-go="request">${T('Request Blood')}</button><button class="s" data-go="camps">${T('Book a donation')}</button></div></div>
<div class="grid"><div class="card"><div class="stat">${av}</div>units available (simulated)</div><div class="card"><div class="stat">${a.units.filter(u=>u.st=='testing').length}</div>awaiting testing, cannot be issued</div><div class="card"><div class="stat">${a.reqs.filter(r=>!['Fulfilled','Unable to fulfil'].includes(r.st)).length}</div>open requests</div></div>
<div class="card"><h3>Judge walkthrough</h3><ol><li>Find blood: O- Red cells.</li><li>Request it, copy the request ID.</li><li>Switch role to Blood bank admin, open Requests: verify, reserve, issue.</li><li>Open Inventory and trace the unit.</li><li>Check Insights, book a camp slot, file a concern, then see Audit.</li></ol><p class="mu">BloodLink is not a substitute for emergency care. Contact an authorized blood bank directly in emergencies.</p></div>`}
if(p=='help')return`<h2>Help, privacy and limits</h2><div class="card"><h3>How do I...?</h3><p><b>Find blood:</b> use Find Blood, pick group, component and district.<br><b>Request:</b> Request Blood, then save your request ID and phone last 4 digits.<br><b>Track:</b> Track page, ID plus phone last 4.<br><b>Donate:</b> register under Donors, then book a camp slot.</p></div><div class="card"><h3>Privacy (demo)</h3><p>Name, phone last 4 digits, blood group and district are kept only in this browser (localStorage) to run the demo. Full phone numbers are not stored. Nothing is sent to a server. Use Audit &rarr; Export data JSON to see everything held, or Reset demo data to delete it. Do not enter real personal or medical data.</p></div><div class="card"><h3>Limits</h3><p>All facilities, stock and verification labels are fictional. No SMS, email or payment is sent. Role switching is not real login. The audit log lives in the browser and can be edited by anyone with access to it. Not a substitute for emergency care: contact an authorized blood bank or hospital directly.</p></div>`;
if(p=='nf')return`<div class="card"><h2>Page not found</h2><p>That page does not exist.</p><button data-go="home">Back to home</button></div>`;
if(p=='dir')return`<h2>Blood bank directory</h2><p class="mu">Fictional facilities. Verification status is a demo label, not a real licence.</p>${F.map(f=>`<div class="card"><b>${esc(f.n)}</b> <span class="b wn">Verified in demo</span><br>${f.t} · ${f.c}, ${f.d} · ${a.units.filter(u=>u.fac==f.id&&free(u)).length} available unit(s), ${a.units.filter(u=>u.fac==f.id&&u.st=='testing').length} awaiting testing<br><button data-act="reqfor" data-v="${f.id}||">Request here</button></div>`).join('')}`;
if(p=='donor')return`<h2>Donor registration</h2><form id="df" class="card grid"><label>Name<input name="name" required minlength="2"></label><label>Phone (demo)<input name="ph" required pattern="[0-9]{10}" title="10 digits"></label><label>Blood group (if known)<select name="grp"><option value="">Unknown${opt(G)}</select></label><label>District<select name="d">${opt([...new Set(F.map(f=>f.d))])}</select></label><label><span><input type="checkbox" name="ok" required> I consent to relevant demo notifications. Eligibility is decided by qualified staff, not this site.</span></label><button class="r">Register</button></form>${isA()?`<h3>Donor records (admin, phones masked)</h3>${(a.donors||[]).map(d=>`<div class="card">${esc(d.id)} · ${esc(d.name)} · ${d.grp||'group unknown'} · ${esc(d.d)} · ******${d.ph}</div>`).join('')||'<p class="mu">No donors registered yet.</p>'}`:'<p class="mu">Donor records are visible to blood bank admins only.</p>'}`;
if(p=='find'){const r=a.units.filter(u=>free(u)&&(!q.g||u.grp==q.g)&&(!q.c||u.comp==q.c)&&(!q.d||F.find(f=>f.id==u.fac).d==q.d)&&(!q.fa||u.fac==q.fa));const by={};r.forEach(u=>{const k=u.fac+u.grp+u.comp,x=by[k]=by[k]||{u,n:0};x.n++;if(u.exp<x.u.exp)x.u=u});const L=Object.values(by).sort((a,b)=>a.u.exp<b.u.exp?-1:1);
return`<h2>Find blood</h2><div class="card row"><label>Group<select id="qg"><option value="">Any${opt(G,q.g)}</select></label><label>Component<select id="qc"><option value="">Any${opt(C,q.c)}</select></label><label>District<select id="qd"><option value="">Any${opt([...new Set(F.map(f=>f.d))],q.d)}</select></label><label>Facility<select id="qf"><option value="">Any${F.map(f=>`<option value="${f.id}"${f.id==q.fa?' selected':''}>${f.n}`).join('')}</select></label><button data-act="search">Search</button><button class="s" data-act="resetq">Reset filters</button></div>
<p class="mu">${L.length} result(s), sorted by earliest expiry. All stock is simulated.</p>${L.map(x=>`<div class="card"><b>${esc(fn(x.u.fac))}</b> <span class="b wn">Demo verified</span><br>${x.u.grp} · ${x.u.comp} · <b>${x.n}</b> unit(s) · earliest expiry ${x.u.exp} · stock last updated ${esc(x.u.upd)}<br><small class="mu">Facility confirmation required; availability is not guaranteed.</small><br><button data-act="reqfor" data-v="${x.u.fac}|${x.u.grp}|${x.u.comp}">Request this</button></div>`).join('')||'<div class="card">No matches. Try another component, group or district.</div>'}`}
if(p=='request'){return`<h2>Request blood</h2><form id="rf" class="card grid"><label>Your name<input name="name" required></label><label>Phone (demo)<input name="ph" required pattern="[0-9]{10}" title="10 digits"></label><label>Group<select name="grp">${opt(G,q.g)}</select></label><label>Component<select name="comp">${opt(C,q.c)}</select></label><label>Units<input name="qty" type="number" min="1" max="4" value="1"></label><label>Facility<select name="fac">${F.map(f=>`<option value="${f.id}"${f.id==q.f?' selected':''}>${f.n}`).join('')}</select></label><label><span><input type="checkbox" name="ok" required> I understand this is a demo, no blood is guaranteed.</span></label><button class="r">Submit request</button></form>`}
if(p=='track'){const r=a.reqs.find(x=>x.id==(q.id||'').trim().toUpperCase());return`<h2>Track request</h2>${q.fresh?`<div class="card ok"><b>Request submitted.</b> Save your ID <b>${esc(q.id)}</b> and phone last 4 digits <b>${esc(q.fresh)}</b>. You need both to track it later.</div>`:''}<div class="card row"><label>Request ID<input id="tid" value="${esc(q.id||'')}"></label><label>Phone last 4 (demo REQ-2001 uses 1234)<input id="tph" maxlength="4"></label><button data-act="track">Track</button></div>${q.id?(r?`<div class="card"><b>${r.id}</b> <button class="s" data-act="copy" data-v="${r.id}">Copy ID</button> <span class="b ${r.st=='Fulfilled'?'ok':'wn'}">${r.st}</span><p>${r.grp} ${r.comp} × ${r.qty} at ${esc(fn(r.fac))}</p><div class="tl">${r.log.map(l=>`<div><b>${l[0]}</b><br><small class="mu">${l[1]}</small></div>`).join('')}</div></div>`:'<div class="card er">No request found, or the check failed.</div>'):''}`}
if(p=='camps'){return`<h2>Donation camps</h2>${a.camps.map(c=>{const left=c.cap-c.booked;return`<div class="card"><b>${esc(c.n)}</b> · ${c.date} · ${esc(fn(c.fac))}<br>${left} of ${c.cap} slots left <button data-act="book" data-v="${c.id}" ${left?'':'disabled'}>${left?'Book slot':'Full'}</button></div>`}).join('')}<h3>My appointments</h3>${a.appts.map(x=>`<div class="card">${x.id} · ${esc(x.n)} · ${x.date} ${x.st=='Cancelled'?'<span class="b er">Cancelled</span>':'<span class="b ok">Confirmed</span> <button class="s" data-act="cancelap" data-v="${x.id}">Cancel</button>'}</div>`).join('')||'<p class="mu">None yet. Collection and eligibility screening are done by qualified staff, not this site.</p>'}`}
if(p=='charges'){const items=[['Processing and testing','Facility',1,850,0],['Storage and handling','Facility',1,150,150],['Transport','Facility',1,200,0]],t=items.reduce((s,i)=>s+i[2]*i[3]-i[4],0);
return`<h2>Charges and transparency</h2><div class="card tw"><b>Sample invoice (fictional, no payment)</b><table><tr><th>Item<th>Charged by<th>Qty<th>Price<th>Waiver<th>Total</tr>${items.map(i=>`<tr><td>${i[0]}<td>${i[1]}<td>${i[2]}<td>₹${i[3]}<td>₹${i[4]}<td>₹${i[2]*i[3]-i[4]}`).join('')}<tr><th colspan=5>Payable<th>₹${t}</tr></table><button class="s" data-act="print">Print invoice</button> <small class="mu">Real charges depend on the facility and current rules.</small></div>
<form id="cf" class="card row"><label>Category<select name="cat"><option>Overcharging<option>Misleading claim<option>Privacy<option>Other</select></label><label style="flex:1">Describe the concern<input name="txt" required minlength="10"></label><button class="r">Submit concern</button></form>
<h3>Concerns</h3>${a.comps.map(c=>`<div class="card"><b>${c.id}</b> ${c.cat} <span class="b wn">${c.st}</span><br>${esc(c.txt)}${c.note?`<br><i>${esc(c.note)}</i>`:''}${isA()&&c.st!='Resolved'?` <button class="s" data-act="resolve" data-v="${c.id}">Resolve</button>`:''}</div>`).join('')}`}
if(p=='inv'){const f=q.s?a.units.filter(u=>u.st==q.s):a.units,cnt=s=>a.units.filter(u=>u.st==s).length;const soon=a.units.filter(u=>u.st=='available'&&u.exp>=day(0)&&u.exp<=day(7)).length;
return`<h2>Inventory</h2><div class="grid">${['available','reserved','testing','issued','expired','discarded'].map(s=>`<div class="card"><div class="stat">${cnt(s)}</div><span class="${cls(s)}">${s}</span></div>`).join('')}<div class="card"><div class="stat">${soon}</div><span class="wn">expiring in 7 days</span></div></div>
<h3>Stock by group (available)</h3><div class="card">${G.map(g=>{const n=a.units.filter(u=>u.grp==g&&free(u)).length;return`<div class="row" style="align-items:center"><span style="width:36px">${g}</span><div class="bar" style="width:${n*14}px"></div> ${n}${n<3?' <span class="er">low</span>':''}</div>`}).join('')}</div>
<form id="uf" class="card row"><b>Add unit (starts as awaiting testing)</b><label>Unit ID<input name="id" required placeholder="BU-2001"></label><label>Group<select name="grp">${opt(G)}</select></label><label>Component<select name="comp">${opt(C)}</select></label><label>Facility<select name="fac">${F.map(f=>`<option value="${f.id}">${f.n}`).join('')}</select></label><label>Qty<input name="qty" type="number" min="1" max="4" value="1"></label><label>Expiry<input name="exp" type="date" required></label><button class="r">Add</button></form><div class="row"><label>Status<select id="sf"><option value="">All${opt(['available','reserved','testing','issued','expired','discarded'],q.s)}</select></label></div>
<div class="card tw"><table><tr><th>Unit<th>Facility<th>Group<th>Component<th>Expiry<th>Status<th></tr>${f.slice(0,60).map(u=>`<tr><td>${u.id}<td>${esc(fn(u.fac))}<td>${u.grp}<td>${u.comp}<td>${u.exp}<td><span class="${cls(u.st)}">${u.st}</span><td><button class="s" data-act="trace" data-v="${u.id}">Trace</button>${u.st=='testing'?` <button class="s" data-act="release" data-v="${u.id}">Approve release</button>`:''}${u.st=='available'||u.st=='expired'?` <button class="s" data-act="discard" data-v="${u.id}">Discard</button>`:''}`).join('')}</table></div><button class="s" data-act="invcsv">Download inventory CSV</button>${q.t?trace(q.t):''}`}
if(p=='reqs'){return`<h2>Requests</h2>${a.reqs.map(r=>{const bt=[];if(r.st=='Awaiting verification')bt.push(['verify','Verify'],['reject','Reject']);if(r.st=='Verified')bt.push(['reserve','Reserve units']);if(r.st=='Reserved')bt.push(['issue','Issue units'],['unres','Cancel reservation']);return`<div class="card"><b>${r.id}</b> <span class="b wn">${r.st}</span> ${r.grp} ${r.comp} × ${r.qty} · ${esc(fn(r.fac))}<br>${r.units.length?'Units: '+r.units.join(', ')+'<br>':''}${bt.map(b=>`<button class="${b[0]=='reject'||b[0]=='unres'?'s':''}" data-act="${b[0]}" data-v="${r.id}">${b[1]}</button>`).join(' ')}</div>`}).join('')}`}
if(p=='insights'){const out=[];G.forEach(g=>{const n=a.units.filter(u=>u.grp==g&&free(u)).length;if(n<3)out.push([`${g} stock is low (${n} unit(s))`,'Plan a camp or request transfer.','High'])});const e=a.units.filter(u=>free(u)&&u.exp<=day(5));if(e.length)out.push([`${e.length} unit(s) expire within 5 days`,'Prioritise earliest expiry first, with staff confirmation.','High']);const full=a.camps.filter(c=>c.booked>=c.cap);full.forEach(c=>out.push([`${c.n} is full`,'Consider adding slots.','Medium']));const open=a.reqs.filter(r=>r.st=='Awaiting verification').length;if(open)out.push([`${open} request(s) await verification`,'Review them first.','High']);
return`<h2>Insights</h2><p class="mu">Rule-based estimates from demo data. Not clinical advice and not a guarantee of future stock.</p>${out.map(o=>`<div class="card"><b>${o[0]}</b><br>${o[1]} <span class="b mu">${o[2]} confidence</span></div>`).join('')||'<div class="card">No alerts right now.</div>'}`}
if(p=='audit'){return`<h2>Audit log</h2><div class="card tw"><table><tr><th>When<th>Actor<th>Action</tr>${a.audit.slice(0,80).map(l=>`<tr><td>${l[2]}<td>${l[0]}<td>${esc(l[1])}`).join('')}</table></div><button class="s" data-act="csv">Download audit CSV</button> <button class="s" data-act="json">Export data JSON</button> <button class="s" data-act="reset">Reset demo data</button><p class="mu">Browser-only log: not tamper-proof.</p>`}
if(p=='notif'){return`<h2>Notifications (simulated)</h2><button class="s" data-act="readall">Mark all read</button>${a.notifs.slice(0,30).map((n,i)=>`<div class="card ${n.r?'mu':''}">${n.r?'':'<b class="b wn">New</b> '}${esc(n.t)} ${n.r?'':`<button class="s" data-act="read1" data-v="${i}">Mark read</button>`}</div>`).join('')||'<p class="mu">No notifications yet.</p>'}`}}
function trace(id){const u=S.units.find(x=>x.id==id);return u?`<div class="card"><h3>Traceability: ${u.id}</h3><p class="mu">Donor reference: DN-${u.id.slice(3)} (hidden from non-admins). Status: ${u.st}</p><div class="tl">${u.log.map(l=>`<div><b>${l[0]}</b><br><small class="mu">${l[1]}</small></div>`).join('')}</div></div>`:''}
function draw(){$('#nav').innerHTML=Object.entries(pages).filter(([k])=>!pages[k].includes('*')||isA()).map(([k,v])=>`<a href="#${k}" class="${k==page?'on':''}">${T(v.replace('*',''))}${k=='notif'?` (${S.notifs.filter(n=>!n.r).length})`:''}</a>`).join('');$('#app').innerHTML=view();document.title=(pages[page]||'Not found').replace('*','')+' · BloodLink (Demo)'}
const go=p=>{location.hash=p};
function setU(u,st,msg){u.st=st;u.upd=now();u.log.push([msg,now()])}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act]');if(!t)return;if(t.dataset.go)return go(t.dataset.go);const a=t.dataset.act,v=t.dataset.v,R=S.reqs.find(r=>r.id==v),U=S.units.find(u=>u.id==v),who=role();
if(a=='search'){q.g=$('#qg').value;q.c=$('#qc').value;q.d=$('#qd').value;q.fa=$('#qf').value}
else if(a=='resetq')q={}
else if(a=='reqfor'){const[f,g,c]=v.split('|');q={f,g,c};return go('request')}
else if(a=='track'){q.id=$('#tid').value;q.fresh='';const r=S.reqs.find(x=>x.id==q.id.trim().toUpperCase());if(r&&r.ph&&r.ph!=$('#tph').value){q.id='none';toast('Verification failed')}}
else if(a=='book'){const c=S.camps.find(x=>x.id==v);if(c.booked>=c.cap)return toast('Camp is full');if(S.appts.some(x=>x.cid==c.id&&x.st!='Cancelled'))return toast('You already have an active booking for this camp');c.booked++;const ref='AP-'+(1001+S.appts.length);S.appts.push({id:ref,cid:c.id,n:c.n,date:c.date,st:'Confirmed'});note('Appointment confirmed: '+c.n);log(who,'Booked '+c.n+' ('+ref+')');toast('Booked. Appointment reference '+ref)}
else if(a=='cancelap'){const x=S.appts.find(p=>p.id==v);if(!confirm('Cancel appointment '+x.id+'?'))return;if(x.st!='Cancelled'){S.camps.find(c=>c.id==x.cid).booked--;x.st='Cancelled'}log(who,'Cancelled appointment '+x.id);toast('Appointment cancelled')}
else if(a=='resolve'){const c=S.comps.find(x=>x.id==v);c.st='Resolved';c.note='Reviewed: duplicate charge refunded in the demo.';note('Concern '+v+' resolved');log(who,'Resolved '+v);toast('Resolved')}
else if(a=='trace')q.t=v;
else if(a=='release'){if(!confirm('Approve '+v+' for release?\n\nOnly confirm if authorized staff have verified completed screening records. This button is not proof that screening passed.'))return;setU(U,'available','Screening cleared and released by authorized staff (demo)');log(who,'Released '+v);toast('Released')}
else if(a=='discard'){if(!confirm('Discard '+v+'? This cannot be undone.'))return;setU(U,'discarded','Discarded');log(who,'Discarded '+v)}
else if(a=='verify'){R.st='Verified';R.log.push(['Verified',now()]);note(R.id+' verified');log(who,'Verified '+v)}
else if(a=='reject'){R.st='Unable to fulfil';R.log.push(['Unable to fulfil',now()]);note(R.id+' rejected');log(who,'Rejected '+v)}
else if(a=='reserve'){const c=S.units.filter(u=>free(u)&&u.fac==R.fac&&u.grp==R.grp&&u.comp==R.comp).sort((x,y)=>x.exp<y.exp?-1:1).slice(0,R.qty);if(c.length<R.qty){R.log.push(['Reservation failed: not enough eligible units; no stock changed',now()]);toast('Not enough eligible units. Nothing was changed.')}else{c.forEach(u=>setU(u,'reserved','Reserved for '+R.id));R.units=c.map(u=>u.id);R.st='Reserved';R.log.push(['Reserved (earliest expiry first)',now()]);toast('Reserved')}log(who,'Reserve '+v)}
else if(a=='unres'){R.units.forEach(i=>setU(S.units.find(u=>u.id==i),'available','Reservation cancelled'));R.units=[];R.st='Verified';R.log.push(['Reservation cancelled',now()]);log(who,'Cancelled reservation '+v)}
else if(a=='issue'){if(!confirm('Issue units for '+R.id+'?'))return;const bad=R.units.some(i=>{const u=S.units.find(x=>x.id==i);return u.st!='reserved'||u.exp<day(0)});if(bad)return toast('Blocked: a unit is expired or not reserved');R.units.forEach(i=>setU(S.units.find(u=>u.id==i),'issued','Issued and handed over for '+R.id));R.st='Fulfilled';R.log.push(['Issued and handed over',now()]);note(R.id+' fulfilled');log(who,'Issued '+v);toast('Issued')}
else if(a=='copy'){navigator.clipboard?.writeText(v);toast('Copied '+v)}
else if(a=='print')return window.print();
else if(a=='invcsv'){dl('bloodlink-inventory.csv','Unit,Facility,Group,Component,Expiry,Status\n'+S.units.map(u=>[u.id,fn(u.fac),u.grp,u.comp,u.exp,u.st].join(',')).join('\n'));return}
else if(a=='csv'||a=='json'){const s=a=='csv'?'When,Actor,Action\n'+S.audit.map(l=>[l[2],l[0],l[1]].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'):JSON.stringify(S,null,1);dl('bloodlink-'+a+'.'+a,s);return}
else if(a=='read1')S.notifs[+v].r=1;
else if(a=='readall')S.notifs.forEach(n=>n.r=1);
else if(a=='reset'){if(!confirm('Reset all demo data?'))return;S=seed();q={}}
save();draw()});
document.addEventListener('change',e=>{if(e.target.id=='sf'){q.s=e.target.value;draw()}});
document.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
if(e.target.id=='rf'){const r={id:'REQ-'+(S.seq=Math.max(S.seq||0,2001,...S.reqs.map(x=>+x.id.slice(4)||0))+1),name:d.name,ph:d.ph.slice(-4),grp:d.grp,comp:d.comp,qty:+d.qty,fac:d.fac,st:'Awaiting verification',units:[],log:[['Submitted',now()]]};S.reqs.push(r);note('New request '+r.id);log('Requester','Submitted '+r.id);q={id:r.id};q={id:r.id,fresh:r.ph};toast('Request '+r.id+' created');go('track')}
if(e.target.id=='df'){S.donors=S.donors||[];const x={id:'DN-'+(5001+S.donors.length),name:d.name,ph:d.ph.slice(-4),grp:d.grp,d:d.d};S.donors.push(x);note('Donor registered: '+x.id);log('Donor','Registered '+x.id);toast('Registered as '+x.id)}
if(e.target.id=='uf'){if(S.units.some(u=>u.id==d.id.trim().toUpperCase()))return toast('Duplicate unit ID');if(+d.qty<1||!d.exp||d.exp<=day(0))return toast('Quantity must be 1+ and expiry must be a future date');const u={id:d.id.trim().toUpperCase(),fac:d.fac,grp:d.grp,comp:d.comp,qty:+d.qty,exp:d.exp,st:'testing',upd:now(),log:[['Collected, testing pending',now()]]};S.units.unshift(u);log(role(),'Added unit '+u.id);toast('Unit added, awaiting testing')}
if(e.target.id=='cf'){const c={id:'CMP-'+(3001+S.comps.length),cat:d.cat,txt:d.txt,st:'Under review',note:''};S.comps.push(c);note('Concern '+c.id+' submitted');log('User','Concern '+c.id);toast('Reference '+c.id)}save();draw()});
$('#role').onchange=draw;$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('bll',lang)}catch(x){}draw()};
const ax=JSON.parse(localStorage.getItem('bla')||'{}');document.querySelectorAll('[data-ax]').forEach(c=>{c.checked=!!ax[c.dataset.ax];document.documentElement.classList.toggle(c.dataset.ax,c.checked);c.onchange=()=>{ax[c.dataset.ax]=c.checked;document.documentElement.classList.toggle(c.dataset.ax,c.checked);try{localStorage.setItem('bla',JSON.stringify(ax))}catch(e){}}});
$('#th').onclick=()=>{const d=document.documentElement,n=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('blt',n)}catch(e){}};
try{const t=localStorage.getItem('blt');if(t)document.documentElement.dataset.theme=t}catch(e){}
function route(){const h=location.hash.slice(1);page=!h?'home':pages[h]?h:'nf';draw()}
addEventListener('hashchange',route);route();
</script></body></html>
